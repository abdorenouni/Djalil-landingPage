# ─────────────────────────────────────────────────────────────────────
# Elite Backend — nginx (production)
#
# Remplacer api.elite-promotion.dz par le domaine réel, et le chemin
# /var/www/elite-backend par le chemin d'installation.
# Certificat TLS : certbot --nginx -d api.elite-promotion.dz
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api.elite-promotion.dz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.elite-promotion.dz;

    root /var/www/elite-backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.elite-promotion.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.elite-promotion.dz/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # ── WebSockets (Laravel Reverb, service local sur :8080) ─────────
    # Le client se connecte en wss://api.elite-promotion.dz/app/{key}
    location ~ ^/app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Application Laravel ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Adapter à la version PHP installée (php8.3-fpm / php8.4-fpm).
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
