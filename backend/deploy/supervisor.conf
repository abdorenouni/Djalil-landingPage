# ─────────────────────────────────────────────────────────────────────
# Elite Backend — supervisor (production)
#
# Copier dans /etc/supervisor/conf.d/elite-backend.conf puis :
#   sudo supervisorctl reread && sudo supervisorctl update
#
# Deux processus longue durée en plus de PHP-FPM :
#   1. Reverb  — serveur WebSocket (temps réel des tableaux de bord)
#   2. Queue   — notifications (emails, base) et diffusion des événements
# ─────────────────────────────────────────────────────────────────────

[program:elite-reverb]
command=php /var/www/elite-backend/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/elite-backend
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
stdout_logfile=/var/www/elite-backend/storage/logs/reverb.log
stderr_logfile=/var/www/elite-backend/storage/logs/reverb-error.log

[program:elite-queue]
command=php /var/www/elite-backend/artisan queue:work --tries=3 --max-time=3600 --sleep=2
directory=/var/www/elite-backend
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/www/elite-backend/storage/logs/queue.log
stderr_logfile=/var/www/elite-backend/storage/logs/queue-error.log
