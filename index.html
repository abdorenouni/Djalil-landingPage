<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Apply the saved theme before paint (no flash). Light is the default. -->
    <script>try{if(localStorage.getItem('elite-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
    <!-- Per-page <title>/<meta>/JSON-LD are rendered by <Seo> (src/lib/seo.tsx) and hoisted by React 19. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
